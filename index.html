<!doctype html>
<html lang="ru" data-skin="premium">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trend — магазин техники</title>
  <meta name="description" content="Trend: iPhone, Samsung, MacBook, наушники и часы. Рассрочка, доставка за 1–2 дня и самовывоз из ближайшего магазина в Ташкенте.">
  <meta name="theme-color" content="#0a0f1f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a6cff'/%3E%3Cpath d='M8 9h16v5h-5.5v10h-5V14H8z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://store.storeimages.cdn-apple.com">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/skin-premium.css?v=4" id="skin-css">
  <script>
    /* Тема, вариант дизайна и язык применяются до отрисовки, чтобы не было мигания */
    (function () {
      try {
        var t = localStorage.getItem('tr_theme'); if (t) document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('tr_skin'); if (['premium', 'lite', 'green', 'mono', 'uzbek'].indexOf(s) >= 0) { document.documentElement.dataset.skin = s; document.getElementById('skin-css').href = 'css/skin-' + s + '.css?v=4'; }
        var l = localStorage.getItem('tr_lang'); if (['ru', 'uz', 'en'].indexOf(l) >= 0) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#/" class="logo" aria-label="Trend">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--primary)"/><path d="M8 9h16v5h-5.5v10h-5V14H8z" fill="#fff"/></svg>
        <span>Trend</span>
      </a>
      <nav class="nav">
        <a href="#/catalog" data-nav="catalog" data-i18n="nav.catalog">Каталог</a>
        <a href="#/catalog?cat=phones" data-i18n="nav.phones">Смартфоны</a>
        <a href="#/catalog?cat=laptops" data-i18n="nav.laptops">Ноутбуки</a>
        <a href="#/stores" data-nav="stores" data-i18n="nav.stores">Магазины</a>
      </nav>
      <form class="search" id="search-form" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search-input" placeholder="Поиск: iPhone, MacBook, наушники…" autocomplete="off" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.label">
      </form>
      <div class="header__actions">
        <label class="hdr-select hdr-select--lang">
          <select id="lang-select" data-i18n-aria="header.lang">
            <option value="ru">RU</option>
            <option value="uz">UZ</option>
            <option value="en">EN</option>
          </select>
        </label>
        <label class="hdr-select">
          <select id="skin-select" data-i18n-aria="header.skin">
            <option value="premium" data-i18n="skin.premium">Premium</option>
            <option value="lite" data-i18n="skin.lite">Lite</option>
            <option value="green" data-i18n="skin.green">Зелёный</option>
            <option value="mono" data-i18n="skin.mono">Чёрно-белый</option>
            <option value="uzbek" data-i18n="skin.uzbek">Узбекистан</option>
          </select>
        </label>
        <button class="icon-btn" id="theme-btn" type="button" data-i18n-aria="header.theme" data-i18n-title="header.theme">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <a href="#/cart" class="icon-btn" id="cart-btn" data-i18n-aria="header.cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h14l-1.5 8h-11L6 3H3"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
          <span class="badge" id="cart-count" hidden>0</span>
        </a>
        <a href="#/account" class="icon-btn" id="account-btn" data-i18n-aria="header.account">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span class="avatar" id="account-avatar" hidden></span>
        </a>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <div class="container footer__grid">
      <div class="footer__brand">
        <a href="#/" class="logo"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--primary)"/><path d="M8 9h16v5h-5.5v10h-5V14H8z" fill="#fff"/></svg><span>Trend</span></a>
        <p class="muted" data-i18n="footer.about"></p>
      </div>
      <div>
        <h4 data-i18n="footer.catalog"></h4>
        <a href="#/catalog?cat=phones" data-i18n="cat.phones"></a>
        <a href="#/catalog?cat=laptops" data-i18n="cat.laptops"></a>
        <a href="#/catalog?cat=tablets" data-i18n="cat.tablets"></a>
        <a href="#/catalog?cat=audio" data-i18n="cat.audio"></a>
        <a href="#/catalog?cat=watches" data-i18n="cat.watches"></a>
      </div>
      <div>
        <h4 data-i18n="footer.customers"></h4>
        <a href="#/stores" data-i18n="footer.storesMap"></a>
        <a href="#/cart" data-i18n="header.cart"></a>
        <a href="#/account" data-i18n="header.account"></a>
        <a href="#/login?mode=register" data-i18n="footer.register"></a>
      </div>
      <div>
        <h4 data-i18n="footer.contacts"></h4>
        <a href="tel:+998712001001">+998 71 200-10-01</a>
        <span class="muted" data-i18n="footer.hours"></span>
        <span class="muted" data-i18n="footer.address"></span>
      </div>
    </div>
    <div class="container footer__bottom"><span>© 2026 Trend</span><span class="muted" data-i18n="footer.demo"></span></div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js?v=4" defer></script>
  <script src="js/data.js?v=4" defer></script>
  <script src="js/app.js?v=4" defer></script>
</body>
</html>
